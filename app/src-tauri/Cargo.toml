[package]
name = "ebbinghaus-v2"
version = "0.1.3"
description = "Ebbinghaus V2 Tauri 2 平台壳：桌面（macOS/Windows/Linux）与移动（Android/iOS）共享同一套启动逻辑"
edition = "2021"

# Tauri 2 的移动端约定：Android/iOS 不执行二进制 main，而是通过 FFI 加载动态库并
# 调用 lib 中带 mobile_entry_point 的入口。因此逻辑统一放在 lib（名字独立于包名），
# 桌面 main.rs 只做转发；三种 crate-type 分别服务 iOS（staticlib）、Android（cdylib）
# 与桌面二进制链接（rlib）。
[lib]
name = "ebbinghaus_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 原生自动验收显式启用；正式构建不传入该特性，避免启动 WebDriver 服务。
wdio-test = []

# 版本锁定依据（2026-09-20 实查 crates.io 版本与发布日期）：
# - tauri =2.11.5：tauri 2.x 线最高稳定版（2026-07-01 发布），与技术决策锁定的
#   @tauri-apps/api 2.11.1 / @tauri-apps/cli 2.11.4 同代（npm 侧 2.11.x 对应 Rust 侧 2.11.x）。
# - tauri-build =2.6.3：与 tauri 2.11.x 同一发布列车——2.6.3 与 tauri 2.11.3 同日发布
#   （2026-06-17），tauri 2.11.4 / 2.11.5 为 tauri 单包补丁，未伴随更新的 tauri-build，
#   因此 2.6.3 就是 2.11.5 的精确配套版（优于任务书提示的旧版 2.5.3）。
# 两者均用 "=" 精确锁定，保证可复现构建；crates 下载走 ~/.cargo/config.toml 的 rsproxy 镜像。
[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-sql = { version = "=2.4.1", features = ["sqlite"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "query"] }
tokio = { version = "1", features = ["sync", "macros", "time"] }
aes-gcm = "=0.10.3"
scrypt = "=0.11.0"
base64 = "=0.22.1"
# 这两项插件仅供 macOS 原生验收。上游 1.4.0 的 Android 源码无法编译，
# 因此 Android target 不能解析到它们；是否初始化仍由 wdio-test 控制。
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-wdio = "=1.4.0"
tauri-plugin-wdio-webdriver = "=1.4.0"

[target.'cfg(target_os = "android")'.dependencies]
getrandom = "=0.4.3"
jni = "=0.21.1"
# Tauri/Wry 使用 JNI 0.21；reqwest 的 Android 系统证书验证器使用 JNI 0.22。
# 通过 JNI 原始指针在本机回调内转移新建的局部引用，不混用两个版本的包装类型。
jni_verifier = { package = "jni", version = "=0.22.4" }
rustls-platform-verifier = "=0.7.1"

# 其余插件接线占位（Phase 4 闸门测试时启用）：
# 接入顺序与验收闸门见 CLAUDE.md「闸门测试清单（Phase 4）」与 docs/V2迁移技术决策.md。
#   tauri-plugin-http = "2"         # 同步引擎的 HTTP 出口（经权限域收敛，仅放行服务器地址）
#   tauri-plugin-stronghold = "2"   # 密钥存储（LLM 设备本地配置的密钥透传；或评估 keyring 插件）
#   tauri-plugin-notification = "2" # 复习提醒通知
